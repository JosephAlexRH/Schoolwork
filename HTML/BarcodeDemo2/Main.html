<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAN-13 Barcode Scanner</title>
  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
  <style>
    #scanner-container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      text-align: center;
    }
    #video {
      width: 100%;
      border: 2px solid #000;
    }
    #result {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div id="scanner-container">
  <h2>Scan an EAN-13 Barcode</h2>
  <div id="video"></div>
  <p id="result">Scan a product...</p>
</div>
<script src="script.js"></script>
</body>
</html>
